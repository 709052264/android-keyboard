name: Build and Publish arm64 Release APK 

on:
  push:
    branches: [ main, master, zh ]  # 👈 加上 master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        -Dkotlin.daemon.jvm.options="-Xmx3g"
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 👇【新增校验】：确保仓库 A 真的把词典传过来了，防止编出一个没词典的废包
      - name: Verify Builtin Dict
        run: |
          echo "Checking builtin.dict..."
          if [ ! -f "java/assets/builtin.dict" ]; then
            echo "ERROR: java/assets/builtin.dict not found!"
            exit 1
          fi
          SIZE=$(stat -c%s "java/assets/builtin.dict")
          echo "builtin.dict size is $SIZE bytes."
          # 如果词典小于 1MB (1048576 字节)，说明文件可能损坏或没拉取成功
          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: builtin.dict is too small! Did the download fail?"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > my-release.jks

      - name: Build release APK
        run: |
          ./gradlew assembleStableRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/my-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find . -path "*/build/outputs/apk/*" -name "*.apk" -type f -exec cp {} artifacts/ \;
          echo "=== APKs collected ==="
          ls -la artifacts/
          if [ -z "$(ls -A artifacts)" ]; then echo "NO APK FOUND"; exit 1; fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-release
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "FUTO Keyboard Custom Build ${{ github.run_number }}"
          body: "Automated release generated from commit ${{ github.sha }}"
          draft: false
          prerelease: false
          files: artifacts/*.apk
