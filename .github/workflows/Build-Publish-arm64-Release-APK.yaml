name: Build and Publish arm64 Release APK 

on:
  push:
    branches: [ main, zh ]
  workflow_dispatch:

# 👇【新增】赋予 Actions 写入 Release 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        -Dkotlin.daemon.jvm.options="-Xmx3g"
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > my-release.jks

      - name: Build release APK
        run: |
          ./gradlew assembleStableRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/my-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find . -path "*/build/outputs/apk/*" -name "*.apk" -type f -exec cp {} artifacts/ \;
          echo "=== APKs collected ==="
          ls -la artifacts/
          if [ -z "$(ls -A artifacts)" ]; then echo "NO APK FOUND"; exit 1; fi

      # 原有的上传 Artifacts 步骤（保留，方便在 Actions 页面直接下载）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-release
          path: artifacts/*.apk
          if-no-files-found: error

      # 👇【新增】自动创建 Release 并上传 APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 自动使用当前运行序号作为版本号，例如 v1.0.25
          tag_name: "v1.0.${{ github.run_number }}"
          name: "FUTO Keyboard Custom Build ${{ github.run_number }}"
          body: "Automated release generated from commit ${{ github.sha }}"
          draft: false
          prerelease: false
          files: artifacts/*.apk
