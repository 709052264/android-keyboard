name: Build arm64 Release APK

on:
  push:
    branches: [ main, zh ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        -Dkotlin.daemon.jvm.options="-Xmx3g"
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. 把 GitHub Secrets 里的 Base64 还原成 jks 文件
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > my-release.jks

      # 2. 构建 Release 版本，并通过注入参数进行签名
      - name: Build release APK
        run: |
          ./gradlew assembleStableRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/my-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --stacktrace

      # 3. 收集生成的 APK
      - name: Collect APK
        run: |
          mkdir -p artifacts
          find . -path "*/build/outputs/apk/*" -name "*.apk" -type f -exec cp {} artifacts/ \;
          echo "=== APKs collected ==="
          ls -la artifacts/
          if [ -z "$(ls -A artifacts)" ]; then echo "NO APK FOUND"; exit 1; fi

      # 4. 上传
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-release
          path: artifacts/*.apk
          if-no-files-found: error
