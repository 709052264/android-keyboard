name: Build arm64 Debug APK

on:
  push:
    branches: [ main, zh ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4   # ← 这里从 v3 改为 v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build arm64 debug APK
        run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
